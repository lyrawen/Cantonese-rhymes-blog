spring.application.name=yueyunzhi-backend

server.port=8081

# XAMPP MySQL 默认：端口 3306，用户 root，密码为空
spring.datasource.url=jdbc:mysql://localhost:3306/yueyunzhi?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

jwt.secret=your-secret-key-at-least-256-bits-long
jwt.expiration=86400000

# Redis（本地默认，需先启动 Redis 服务）
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0
spring.data.redis.timeout=3000ms

# 文章详情缓存 TTL（分钟）
cache.article-detail.ttl-minutes=30

# CORS 允许的前端来源（逗号分隔，HTTP/WebSocket 共用此配置）
# 生产环境示例：http://localhost:4000,https://yueyunzhi.com
cors.allowed-origins=http://localhost:4000,http://localhost:4001,http://localhost:4002,http://localhost:4003

# DeepSeek API 配置
# 真实密钥放本地 application-secret.properties（见文件末尾说明），此处仅为占位
deepseek.api.key=your-deepseek-api-key
deepseek.api.url=https://api.deepseek.com/v1/chat/completions

# 百度语音合成 / 百度翻译密钥（占位，真实值见本地 application-secret.properties）
baidu.speech.api-key=your-baidu-speech-api-key
baidu.speech.secret-key=your-baidu-speech-secret-key
baidu.translate.api-key=your-baidu-translate-api-key

# 可选引入本地密钥文件（不入库），本地运行时把真实密钥写进去即可覆盖上面的占位值
spring.config.import=optional:classpath:application-secret.properties